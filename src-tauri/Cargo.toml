[package]
name = "scorpio"
version = "0.1.3"
description = "A CS2 crosshair overlay for Windows and Linux that shows only while your game is in focus"
license-file = "../LICENSE"
edition = "2021"
rust-version = "1.80"

[lib]
name = "scorpio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
png = "0.18"
dirs = "7"
# Already linked through Tauri and the updater; named here to size the async
# runtime and to give update checks bundled root certificates.
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
webpki-root-certs = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Globalization",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Wdk_System_SystemInformation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
  "Wdk_System_SystemServices",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["xinput", "shape", "randr"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
